<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel = "stylesheet" href = "styles/index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
</head>
<body>
<header>

</header>
<main>

    <!-- Pour le bouton Menu -->
    <div class="menu-menu menu">
        <button class="menu">Menu</button>
    </div>

    <!-- Pour le menu principal -->
    <div class = "menu-principal menu masque">
        <h1 id = "one" class = "title">Menu</h1>
        <button class ="btn-p">Jouer</button>
        <button class ="btn-p">Paramètres</button>
        <button class = "btn-p btn-return">Quitter</button>
    </div>

    <!-- Pour le menu paramètre -->
    <div class="menu-parametre menu masque">
        <h1 id = "one" class = "title">Paramètres</h1>
        <button class="btn-prm">Affichage</button>
        <button class="btn-prm">Audio</button>
        <button class="btn-prm">Configurations / Touches</button>
        <button class="btn-prm">Langues</button>
        <button class="btn-prm">Crédits</button>
        <button class="btn-prm btn-return">Retour</button>
    </div>


    <!-- Pour l'interface son -->
    <div class = "menu-son menu masque">
        <h1 id="one" class="title">Audio</h1>
        <div  class="barreson">
            <label for="Volume">Volume général : </label>
            <input type="range" class="volume" min="0" max="100" value="80">
            <span class="volume-valeur">ERROR</span>
        </div>
        <div  class="barreson">
            <label for="Volume">Volume musique : </label>
            <input type="range" class="volume" min="0" max="100" value="80">
            <span class="volume-valeur">ERROR</span>
        </div>
        <div  class="barreson">
            <label for="Volume">Volume voix: </label>
            <input type="range" class="volume" min="0" max="100" value="100">
            <span class="volume-valeur">ERROR</span>
        </div>
        <div  class="barreson">
            <label for="Volume">Volume effets: </label>
            <input type="range" class="volume" min="0" max="100" value="80">
            <span class="volume-valeur">ERROR</span>
        </div>
        
        <button class="btn-return">Retour</button>

    </div>



    <!-- Pour l'interface langues -->
    <div class = "menu-langue menu masque">
        <h1 id = "one" class = "title">Langues</h1>
        <h1> Quelle langue voulez vous choisir ?</h1>
        <button class="btn-langue">Chinese</button>
        <button class="btn-langue">Deutsch</button>
        <button class="btn-langue">English</button>
        <button class=  "btn-langue">Français</button>
        <button class="btn-langue">Japanese</button>
        <button class="btn-langue">Korean</button>
        <button class="btn-langue">Malagasy</button>
        <button class="btn-langue">Spanish</button>
        <button class="btn-langue btn-return">Retour (oui c'est une langue (c'est une blague))</button>
    </div>

    <!-- Pour l'interface crédits -->
    <div class = "credit menu masque">
        <h1 id = "one" class = "title">Crédits</h1>
        <h1 id = "one">Développeur : Mahery Rakotomalala</h1>
        <button class = "btn-return">Retour</button>
    </div>







    <!-- Pour l'affichage quand la fonctionnalité est indisponible -->
    <div class = "label menu masque">
        <h1>Indisponible pour le moment</h1>
        <button class = "btn-return">Retour</button>
    </div>

    <!-- Pour l'affichage quand il y a un chargement  -->
    <div class = "loading menu masque">
        <h1>Chargement...</h1>
    </div>

    <!-- Pour l'affichage quand il y a un chargement  -->
    <div class = "loading-end menu masque">
        <h1>Chargement terminé</h1>
    </div>

</main>




<script src ="js/index.js"></script>
</body>
</html>
